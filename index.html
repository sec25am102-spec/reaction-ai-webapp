<!DOCTYPE html>
<html>
<head>
<title>AI Reaction Predictor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
background:linear-gradient(135deg,#0B1E3F,#0F52BA);
font-family:Arial;
color:white;
text-align:center;
padding-top:100px;
}

.card{
background:rgba(255,255,255,0.1);
padding:40px;
width:350px;
margin:auto;
border-radius:20px;
backdrop-filter:blur(10px);
}

input{
width:90%;
padding:12px;
border:none;
border-radius:10px;
margin-top:15px;
}

button{
margin-top:20px;
padding:12px 25px;
background:#00E5FF;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:22px;
color:#00E5FF;
}
</style>
</head>

<body>

<div class="card">
<h1>🧪 AI Reaction Predictor</h1>
<p>Enter Reactants</p>

<input id="reactant" placeholder="Example: H2 + O2">
<br>
<button onclick="predict()">Predict Reaction</button>

<div class="result" id="output"></div>
</div>

<script>
function predict(){
let r=document.getElementById("reactant").value;

let reactions={
"H2 + O2":"H2O (Water)",
"Na + Cl":"NaCl (Salt)",
"C + O2":"CO2 (Carbon Dioxide)",
"N2 + H2":"NH3 (Ammonia)"
};

document.getElementById("output").innerHTML =
reactions[r] || "⚠️ Reaction not found in demo model";
}
</script>

</body>
</html>
